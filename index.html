
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Carousel</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <main class="page">
    <section
  class="carousel"
  id="productCarousel"
  aria-label="Featured products"
  tabindex="0"
>

     
<header class="carousel-header">
  <div class="header-content">
    <p class="eyebrow">CART MADE FOR YOU</p>
    <h1>Featured Products</h1>
    <p>Discover products worth adding to your collection.</p>
  </div>

  <div class="header-actions">
<div class="cart-summary">
      <button class="cart-button" type="button">
        Cart (<span id="cartCount">0</span>)
      </button>

      <p>Total: ₹<span id="cartTotal">0</span></p>
    </div>
    
<div id="cartPanel" class="cart-panel" hidden>
  <div class="cart-panel-header">
    <h2>Your Cart</h2>
    <button id="closeCartBtn" type="button" aria-label="Close cart">
      &times;
    </button>
  </div>

  <div id="cartItems" class="cart-items">
    <!-- Cart items will be generated with JavaScript -->
  </div>

  <div class="cart-panel-footer">
    <p>Subtotal: ₹<span id="panelCartTotal">0</span></p>
    <button id="clearCartBtn" type="button">Clear Cart</button>
  </div>
</div>
 

    <button
      id="playPauseBtn"
      class="play-pause"
      aria-label="Pause autoplay"
    >
      Pause
    </button>
  </div>
</header>


      <div class="carousel-viewport">
        <div class="carousel-track" id="carouselTrack">
          <!-- JavaScript will generate product cards here -->
        </div>
      </div>

      <div class="carousel-footer">
        <button id="prevBtn" aria-label="Previous products">
          &#8592;
        </button>

        <div id="carouselDots"
             class="carousel-dots"
             aria-label="Choose carousel position">
          <!-- JavaScript will generate dots here -->
        </div>

        <button id="nextBtn" aria-label="Next products">
          &#8594;
        </button>
      </div>

      <div class="progress-track"
           role="progressbar"
           aria-label="Time until next slide"
           aria-valuemin="0"
           aria-valuemax="3000"
           aria-valuenow="0">
        <div id="progressBar" class="progress-bar"></div>
      </div>

    </section>
  </main>

  <div id="toast" class="toast"
       role="status" aria-live="polite"></div>

</body>
</html>
